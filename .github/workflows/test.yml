name: Test

on:
  push:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test changed files
    steps:
      - name: Provision runner
        uses: nationalarchives/org-actions-provision-runner@5657f48ecd0fd31bfe857919149f1fdc690d53ed # v1.0.1
        with:
          wiz-sensor-token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: cd terraform && terraform fmt -check --recursive
      - name: Start application
        run: |
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec app poetry run python .github/scripts/generate_index_file.py /home/app/pronom-signatures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COOKIES_DOMAIN: localhost
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: CI=true npx playwright test --grep-invert @wip
      - name: Run unit tests
        run: docker compose exec app poetry run python -m unittest discover -v -s lambdas/test

  check-formatting:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - name: Provision runner
        uses: nationalarchives/org-actions-provision-runner@5657f48ecd0fd31bfe857919149f1fdc690d53ed # v1.0.1
        with:
          wiz-sensor-token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$(pwd)":/app/ ghcr.io/nationalarchives/tna-python-dev:latest /bin/sh -c ". tna-nvm && npm i && checkformat"
