name: Test

on:
  push:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test changed files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: |
          (cd terraform && terraform fmt -check --recursive)
          cp .env.example .env
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec app poetry run python .github/scripts/generate_index_file.py /home/app/pronom-signatures
          npm ci
          npx playwright install
          CI=true TEST_DOMAIN=https://test.pronom.nationalarchives.gov.uk playwright test --grep-invert @wip
          docker compose exec app poetry run python -m unittest discover -v -s lambdas/test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  check-formatting:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$(pwd)":/app/ ghcr.io/nationalarchives/tna-python-dev:latest checkformat
